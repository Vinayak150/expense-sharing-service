name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16.2", "17.6"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-bookworm
        env:
          POSTGRES_USER: expense_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: expense_ci
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_ci -d expense_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://expense_ci:ci_only_not_a_secret@127.0.0.1:5432/expense_ci
      TEST_DATABASE_URL: postgresql+psycopg://expense_ci:ci_only_not_a_secret@127.0.0.1:5432/expense_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -c requirements.lock '.[dev]'
      - name: Dependencies and style
        run: |
          python -m pip check
          ruff check .
          ruff format --check .
      - name: Migrations and model parity
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: Full PostgreSQL test suite
        run: |
          pytest -q --junitxml="$RUNNER_TEMP/pytest.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          suites = list(ET.parse(Path(os.environ["RUNNER_TEMP"]) / "pytest.xml").iter("testsuite"))
          if not sum(int(s.get("tests", 0)) for s in suites):
              raise SystemExit("No tests executed")
          if any(int(s.get("skipped", 0)) for s in suites):
              raise SystemExit("PostgreSQL verification must not skip tests")
          PY
      - name: Build and verify installed wheel
        run: |
          python -m pip wheel --no-deps -c requirements.lock . --wheel-dir dist
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I -c "import app.main; assert len(app.main.app.openapi()['paths']) == 11"
