[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-sharing-service"
version = "0.5.0"
description = "Exact expense ledger and deterministic advisory settlement planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1,<0.144",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0.54,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<0.29", "ruff>=0.12,<1", "hypothesis>=6.130,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]
filterwarnings = ["error"]
